
<section class="news-panel" aria-labelledby="news-panel-title">
<p class="news-panel__eyebrow">What’s happening</p>
<h2 id="news-panel-title">Latest news</h2>

{% for article in site.data.news limit:5 %}
<div class="news-sidebar-item">
<div class="news-sidebar-date">{{ article.date }}</div>
<div class="news-sidebar-body">{{ article.headline | markdownify }}</div>
</div>
{% endfor %}

<a class="news-panel__all" href="{{ '/allnews.html' | relative_url }}">View all news →</a>
</section>
