# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Cyberiad Lab
email: aerdem@ku.edu.tr
description: > # this means to ignore newlines until "baseurl:"
  Cyberiad Lab develops generative and multimodal AI systems for visual understanding, creation, and reasoning.
baseurl: ""
url: "https://cyberiada.github.io"
lab_url: "https://ai.ku.edu.tr/"
github_url: "https://github.com/cyberiada/cyberiada.github.io"
project_pages_url: "https://cyberiada.github.io"
scholar_url: "https://scholar.google.com/citations?user=-xA1_OAAAAAJ&hl=en"
social_image: "/images/og-cyberiad.png"
google_site_verification: ""

plugins:
  - jekyll-sitemap

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass
  quiet_deps: true
  silence_deprecations:
    - import
    - if-function
    - global-builtin
    - color-functions
    - slash-div

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
