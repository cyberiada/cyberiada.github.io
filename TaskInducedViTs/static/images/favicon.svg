<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Anisotropic task metric over a grid of ViT tokens">
  <rect width="64" height="64" rx="12" fill="#12263A"/>

  <!-- ViT token grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2">
    <path d="M22.7 8 V56 M41.3 8 V56 M8 22.7 H56 M8 41.3 H56"/>
  </g>

  <!-- the one token the task is most sensitive to -->
  <rect x="22.7" y="22.7" width="18.6" height="18.6" fill="#F5A524" fill-opacity="0.30"/>

  <!-- anisotropic metric: long axis = task-sensitive, short axis = ignored -->
  <ellipse cx="32" cy="32" rx="21" ry="9" fill="none"
           stroke="#F5A524" stroke-width="4" transform="rotate(-32 32 32)"/>
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF"/>
</svg>
